[project]
name = "local-claude-marketplace"
version = "0.1.0"
description = "Self-hosted marketplace for Claude Code skills and agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "pitmonkey" }]
license = { text = "MIT" }
dependencies = [
    "a2wsgi>=1.10.10",
    "aioboto3>=15.5.0",
    "aiosqlite>=0.22.1",
    "dulwich>=1.2.4",
    "fastapi>=0.136.3",
    "gitpython>=3.1.50",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.46.0",
]

[project.urls]
Repository = "https://github.com/pitmonkey/local-claude-marketplace"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "moto[s3]>=5.2.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "fastapi.*", "git.*", "dotenv.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["a2wsgi.*", "dulwich.*"]
ignore_missing_imports = true
