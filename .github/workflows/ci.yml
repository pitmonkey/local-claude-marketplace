name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    # GitHub-hosted runner: this repo is public, and the org's self-hosted
    # runner group sets allows_public_repositories=false. Enabling that would
    # let fork pull requests execute arbitrary code on the cluster runners, so
    # the public repo uses hosted runners instead.
    uses: pitmonkey/.github/.github/workflows/test-python.yml@main
    with:
      runner: ubuntu-latest
    secrets: inherit

  lint:
    # GitHub-hosted runner: this repo is public, and the org's self-hosted
    # runner group sets allows_public_repositories=false. Enabling that would
    # let fork pull requests execute arbitrary code on the cluster runners, so
    # the public repo uses hosted runners instead.
    uses: pitmonkey/.github/.github/workflows/lint-python.yml@main
    with:
      runner: ubuntu-latest
    secrets: inherit

  build:
    needs: [test, lint]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: pitmonkey/.github/.github/workflows/build-docker.yml@main
    with:
      runner: ubuntu-latest
      image-name: local-claude-marketplace
      # Must be false: DOCKERHUB_USERNAME/TOKEN are org secrets, and GitHub
      # does not expose org secrets to public repositories, so the login
      # action fails with "Username and password required" and takes the
      # whole build with it. Base images are pulled anonymously instead,
      # which risks the shared-IP Docker Hub rate limit on a busy day - the
      # credentials that would avoid it simply cannot reach a public repo.
      dockerhub-auth: false
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
      actions: write
    secrets: inherit

  # Single uniform required status check for the whole org. Job names differ per
  # repo (and a path-filtered job that is skipped emits no check run at all), so a
  # ruleset cannot require them directly. This job always runs, so it always
  # reports. `notify` is excluded deliberately: a Slack delivery failure must not
  # block a merge.
  ci-green:
    needs: [test, lint, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
