name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    uses: pitmonkey/.github/.github/workflows/test-python.yml@main
    secrets: inherit

  lint:
    uses: pitmonkey/.github/.github/workflows/lint-python.yml@main
    secrets: inherit

  build:
    needs: [test, lint]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: pitmonkey/.github/.github/workflows/build-docker.yml@main
    with:
      image-name: local-claude-marketplace
      dockerhub-auth: ${{ github.actor != 'dependabot[bot]' }}
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write
      actions: write
    secrets: inherit

  notify:
    needs: [test, lint, build]
    if: always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: pitmonkey/.github/.github/workflows/notify-slack.yml@main
    with:
      project-name: local-claude-marketplace
      test-result: ${{ needs.test.result }}
      lint-result: ${{ needs.lint.result }}
      build-result: ${{ needs.build.result }}
    secrets: inherit

  # Single uniform required status check for the whole org. Job names differ per
  # repo (and a path-filtered job that is skipped emits no check run at all), so a
  # ruleset cannot require them directly. This job always runs, so it always
  # reports. `notify` is excluded deliberately: a Slack delivery failure must not
  # block a merge.
  ci-green:
    needs: [test, lint, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
