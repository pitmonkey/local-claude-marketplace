{% extends "base.html" %}

{% block title %}Browse Plugins — AI Marketplace{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="rc-section-title">Browse Plugins</h1>

  <!-- Search bar -->
  <div class="flex gap-3 mb-4">
    <div class="rc-search-wrap">
      <svg class="rc-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd"/>
      </svg>
      <input
        type="text"
        name="q"
        value="{{ q or '' }}"
        placeholder="Search plugins..."
        class="rc-search"
        hx-get="/ui/search"
        hx-trigger="input changed delay:300ms"
        hx-target="#plugin-grid"
        hx-include="[name='q'],[name='type'],[name='tags'],[name='client']"
      >
    </div>
    <input type="hidden" name="tags" value="{{ tags or '' }}">
  </div>

  <label>Client
    <select name="client" hx-get="/ui/search" hx-trigger="change" hx-target="#plugin-grid" hx-include="[name='q'],[name='type'],[name='tags'],[name='client']">
      <option value="">All clients</option>
      <option value="claude" {% if client == 'claude' %}selected{% endif %}>Claude</option>
      <option value="codex" {% if client == 'codex' %}selected{% endif %}>Codex</option>
    </select>
  </label>
  <!-- Type tabs -->
  <div class="flex gap-2 mb-6">
    <a
      href="/?client={{ client or '' }}&{% if q %}q={{ q }}&{% endif %}{% if tags %}tags={{ tags }}&{% endif %}"
      class="rc-tab {% if not type %}rc-tab-active-all{% endif %}"
    >All</a>
    <a
      href="/?client={{ client or '' }}&type=skill{% if q %}&q={{ q }}{% endif %}{% if tags %}&tags={{ tags }}{% endif %}"
      class="rc-tab {% if type == 'skill' %}rc-tab-active-skill{% endif %}"
    >Skills</a>
    <a
      href="/?client={{ client or '' }}&type=subagent{% if q %}&q={{ q }}{% endif %}{% if tags %}&tags={{ tags }}{% endif %}"
      class="rc-tab {% if type == 'subagent' %}rc-tab-active-agent{% endif %}"
    >Agents</a>
    <a
      href="/?client={{ client or '' }}&type=plugin{% if q %}&q={{ q }}{% endif %}{% if tags %}&tags={{ tags }}{% endif %}"
      class="rc-tab {% if type == 'plugin' %}rc-tab-active-plugin{% endif %}"
    >Plugins</a>
    <input type="hidden" name="type" value="{{ type or '' }}">
  </div>
</div>

<div id="plugin-grid">
  {% include "partials/plugin_cards.html" %}
</div>
{% endblock %}
