{% extends "base.html" %}

{% block title %}Browse Plugins — Claude Marketplace{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-gray-900 mb-4">Browse Plugins</h1>

  <!-- Search bar -->
  <div class="flex gap-3 mb-4">
    <input
      type="text"
      name="q"
      value="{{ q or '' }}"
      placeholder="Search plugins..."
      class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      hx-get="/ui/search"
      hx-trigger="input changed delay:300ms"
      hx-target="#plugin-grid"
      hx-include="[name='q'],[name='type'],[name='tags']"
    >
    <input type="hidden" name="tags" value="{{ tags or '' }}">
  </div>

  <!-- Type tabs -->
  <div class="flex gap-2 mb-6">
    <a
      href="/?{% if q %}q={{ q }}&{% endif %}{% if tags %}tags={{ tags }}&{% endif %}"
      class="px-4 py-2 rounded-full text-sm font-medium {% if not type %}bg-gray-900 text-white{% else %}bg-white text-gray-600 border border-gray-300 hover:bg-gray-50{% endif %}"
    >All</a>
    <a
      href="/?type=skill{% if q %}&q={{ q }}{% endif %}{% if tags %}&tags={{ tags }}{% endif %}"
      class="px-4 py-2 rounded-full text-sm font-medium {% if type == 'skill' %}bg-blue-600 text-white{% else %}bg-white text-gray-600 border border-gray-300 hover:bg-gray-50{% endif %}"
    >Skills</a>
    <a
      href="/?type=subagent{% if q %}&q={{ q }}{% endif %}{% if tags %}&tags={{ tags }}{% endif %}"
      class="px-4 py-2 rounded-full text-sm font-medium {% if type == 'subagent' %}bg-purple-600 text-white{% else %}bg-white text-gray-600 border border-gray-300 hover:bg-gray-50{% endif %}"
    >Agents</a>
    <input type="hidden" name="type" value="{{ type or '' }}">
  </div>
</div>

<div id="plugin-grid">
  {% include "partials/plugin_cards.html" %}
</div>
{% endblock %}
