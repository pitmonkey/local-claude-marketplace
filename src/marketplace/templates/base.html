<!DOCTYPE html>
<html lang="en" style="background:#0c0c0f">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Claude Marketplace{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    /* ── Design tokens ─────────────────────────────────── */
    :root {
      --bg:             #0c0c0f;
      --surface:        #141417;
      --surface-hover:  #1b1b1f;
      --border:         rgba(255,255,255,0.07);
      --border-strong:  rgba(255,255,255,0.14);
      --text-1:         #eeeef0;
      --text-2:         #7a7a82;
      --text-3:         #38383f;
      --c-skill:        59,130,246;
      --c-agent:        168,85,247;
      --c-plugin:       34,197,94;
      --c-red:          239,68,68;
      --font-sans:      'Outfit', system-ui, sans-serif;
      --font-mono:      'JetBrains Mono', 'Fira Code', monospace;
      --radius-card:    0.875rem;
      --radius-pill:    9999px;
    }

    /* ── Base ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
    }

    code, pre, .font-mono { font-family: var(--font-mono); }

    ::selection {
      background: rgba(59,130,246,0.3);
      color: var(--text-1);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

    *:focus-visible {
      outline: 2px solid rgba(59,130,246,0.7);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .t1 { color: var(--text-1); }
    .t2 { color: var(--text-2); }
    .t3 { color: var(--text-3); }

    /* ── Background glow ───────────────────────────────── */
    body { position: relative; }
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 500px;
      background: radial-gradient(ellipse at center,
        rgba(59,130,246,0.07) 0%,
        rgba(168,85,247,0.03) 40%,
        transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    nav, main { position: relative; z-index: 1; }

    /* ── Navigation ────────────────────────────────────── */
    .rc-nav {
      background: rgba(12,12,15,0.75);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .rc-nav-logo {
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-1);
      text-decoration: none;
    }
    .rc-nav-link {
      font-size: 0.875rem;
      color: var(--text-2);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .rc-nav-link:hover { color: var(--text-1); }

    /* ── Cards ─────────────────────────────────────────── */
    .rc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      text-decoration: none;
      display: block;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.15s ease,
        background 0.15s ease;
    }
    .rc-card:hover {
      border-color: var(--border-strong);
      background: var(--surface-hover);
      transform: translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 12px 32px rgba(0,0,0,0.5),
        0 2px 8px rgba(0,0,0,0.3);
    }

    /* ── Search ────────────────────────────────────────── */
    .rc-search-wrap {
      position: relative;
      flex: 1;
    }
    .rc-search-icon {
      position: absolute;
      left: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1rem;
      height: 1rem;
      color: var(--text-3);
      pointer-events: none;
    }
    .rc-search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      color: var(--text-1);
      padding: 0.5rem 0.875rem 0.5rem 2.5rem;
      font-size: 0.875rem;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .rc-search::placeholder { color: var(--text-3); }
    .rc-search:focus {
      border-color: rgba(59,130,246,0.5);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }

    /* ── Filter tabs ───────────────────────────────────── */
    .rc-tab {
      padding: 0.375rem 1rem;
      border-radius: var(--radius-pill);
      font-size: 0.8125rem;
      font-weight: 500;
      border: 1px solid var(--border);
      color: var(--text-2);
      text-decoration: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .rc-tab:hover { color: var(--text-1); border-color: var(--border-strong); }
    .rc-tab-active-all {
      background: var(--text-1);
      color: var(--bg);
      border-color: transparent;
    }
    .rc-tab-active-skill {
      background: rgba(var(--c-skill),0.14);
      color: rgb(var(--c-skill));
      border-color: rgba(var(--c-skill),0.3);
    }
    .rc-tab-active-agent {
      background: rgba(var(--c-agent),0.14);
      color: rgb(var(--c-agent));
      border-color: rgba(var(--c-agent),0.3);
    }
    .rc-tab-active-plugin {
      background: rgba(var(--c-plugin),0.14);
      color: rgb(var(--c-plugin));
      border-color: rgba(var(--c-plugin),0.3);
    }

    /* ── Badges ────────────────────────────────────────── */
    .rc-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.5rem;
      border-radius: var(--radius-pill);
      font-size: 0.6875rem;
      font-weight: 500;
      border: 1px solid transparent;
      flex-shrink: 0;
    }
    .rc-badge-skill  { background: rgba(var(--c-skill),0.12);  color: rgb(var(--c-skill));  border-color: rgba(var(--c-skill),0.25);  }
    .rc-badge-agent  { background: rgba(var(--c-agent),0.12);  color: rgb(var(--c-agent));  border-color: rgba(var(--c-agent),0.25);  }
    .rc-badge-plugin { background: rgba(var(--c-plugin),0.12); color: rgb(var(--c-plugin)); border-color: rgba(var(--c-plugin),0.25); }
    .rc-badge-system { background: rgba(255,255,255,0.05); color: var(--text-2); border-color: var(--border); }
    .rc-badge-user   { background: rgba(var(--c-plugin),0.10); color: rgb(var(--c-plugin)); border-color: rgba(var(--c-plugin),0.22); }

    /* ── Form inputs ───────────────────────────────────── */
    .rc-label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 0.375rem;
    }
    .rc-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text-1);
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    .rc-input::placeholder { color: var(--text-3); }
    .rc-input:focus {
      border-color: rgba(59,130,246,0.5);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
    .rc-input option { background: #1e1e24; color: var(--text-1); }

    .rc-checkbox {
      width: 1rem;
      height: 1rem;
      accent-color: rgb(var(--c-skill));
      border-radius: 0.25rem;
    }
    .rc-code-inline {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: rgba(255,255,255,0.07);
      color: var(--text-1);
      padding: 0.1em 0.35em;
      border-radius: 0.25rem;
      border: 1px solid var(--border);
    }

    /* ── Buttons ───────────────────────────────────────── */
    .rc-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      font-weight: 500;
      font-family: var(--font-sans);
      border-radius: 0.5rem;
      padding: 0.4375rem 0.875rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .rc-btn-primary {
      background: var(--text-1);
      color: var(--bg);
      border-color: transparent;
    }
    .rc-btn-primary:hover { opacity: 0.88; }
    .rc-btn-reindex {
      background: rgba(var(--c-skill),0.1);
      color: rgb(var(--c-skill));
      border-color: rgba(var(--c-skill),0.25);
      font-size: 0.75rem;
      padding: 0.25rem 0.625rem;
    }
    .rc-btn-reindex:hover { background: rgba(var(--c-skill),0.2); }
    .rc-btn-danger {
      background: rgba(var(--c-red),0.08);
      color: rgb(var(--c-red));
      border-color: rgba(var(--c-red),0.2);
      font-size: 0.75rem;
      padding: 0.25rem 0.625rem;
    }
    .rc-btn-danger:hover { background: rgba(var(--c-red),0.18); }

    /* ── Table ─────────────────────────────────────────── */
    .rc-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
    }
    .rc-table { width: 100%; border-collapse: collapse; }
    .rc-table thead { background: rgba(255,255,255,0.025); }
    .rc-table th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      border-bottom: 1px solid var(--border);
    }
    .rc-table td {
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      color: var(--text-2);
      border-bottom: 1px solid var(--border);
    }
    .rc-table tbody tr:last-child td { border-bottom: none; }
    .rc-table tbody tr:hover td { background: rgba(255,255,255,0.02); }
    .rc-table .td-primary { color: var(--text-1); font-weight: 500; }
    .rc-table a { color: var(--text-2); text-decoration: none; transition: color 0.15s ease; }
    .rc-table a:hover { color: rgb(var(--c-skill)); }

    /* ── Prose ─────────────────────────────────────────── */
    .rc-prose {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
    }
    .rc-prose h1, .rc-prose h2, .rc-prose h3, .rc-prose h4, .rc-prose h5 {
      color: var(--text-1);
      font-family: var(--font-sans);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .rc-prose p, .rc-prose li, .rc-prose blockquote { color: var(--text-2); line-height: 1.7; }
    .rc-prose strong { color: var(--text-1); }
    .rc-prose em { color: var(--text-2); }
    .rc-prose a { color: rgb(var(--c-skill)); text-decoration: none; }
    .rc-prose a:hover { text-decoration: underline; }
    .rc-prose hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .rc-prose code {
      font-family: var(--font-mono);
      font-size: 0.8125em;
      background: rgba(255,255,255,0.07);
      color: var(--text-1);
      padding: 0.15em 0.4em;
      border-radius: 0.25rem;
      border: 1px solid var(--border);
    }
    .rc-prose pre {
      background: rgba(0,0,0,0.45) !important;
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      padding: 1rem 1.25rem;
      overflow-x: auto;
    }
    .rc-prose pre code { background: none; border: none; padding: 0; font-size: 0.8125rem; color: var(--text-1); }
    .rc-prose blockquote {
      border-left: 2px solid rgba(var(--c-skill),0.4);
      padding-left: 1rem;
      color: var(--text-2);
      font-style: italic;
    }
    .rc-prose table { width: 100%; border-collapse: collapse; }
    .rc-prose table th { color: var(--text-2); border-bottom: 1px solid var(--border); padding: 0.5rem 0.75rem; font-size: 0.8125rem; }
    .rc-prose table td { color: var(--text-2); border-bottom: 1px solid var(--border); padding: 0.5rem 0.75rem; font-size: 0.8125rem; }
    .rc-prose table tr:last-child td { border-bottom: none; }

    /* ── Install / misc ────────────────────────────────── */
    .rc-install-box {
      background: rgba(var(--c-skill),0.07);
      border: 1px solid rgba(var(--c-skill),0.18);
      border-radius: var(--radius-card);
    }
    .rc-install-title {
      font-size: 0.8125rem;
      font-weight: 600;
      color: rgb(var(--c-skill));
      margin-bottom: 0.375rem;
    }
    .rc-install-desc {
      font-size: 0.8125rem;
      color: rgba(var(--c-skill),0.7);
      margin-bottom: 0.5rem;
    }
    .rc-install-code {
      display: block;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.625rem 0.875rem;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      color: var(--text-1);
      word-break: break-all;
    }
    .rc-error-box {
      background: rgba(var(--c-red),0.08);
      border: 1px solid rgba(var(--c-red),0.2);
      border-radius: 0.625rem;
      color: rgb(var(--c-red));
    }
    .rc-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.1875rem 0.5rem;
      background: rgba(255,255,255,0.06);
      color: var(--text-2);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      font-size: 0.75rem;
    }
    .rc-empty { text-align: center; padding: 4rem 1rem; }
    .rc-empty p:first-child { font-size: 1rem; font-weight: 500; color: var(--text-2); }
    .rc-empty p:last-child  { font-size: 0.875rem; color: var(--text-3); margin-top: 0.375rem; }
    .rc-section-title {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-1);
      margin-bottom: 1rem;
    }

    /* ── Animations ────────────────────────────────────── */
    @keyframes rc-card-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #plugin-grid a { animation: rc-card-in 0.25s ease both; }
    #plugin-grid a:nth-child(1)  { animation-delay: 0ms;   }
    #plugin-grid a:nth-child(2)  { animation-delay: 35ms;  }
    #plugin-grid a:nth-child(3)  { animation-delay: 70ms;  }
    #plugin-grid a:nth-child(4)  { animation-delay: 105ms; }
    #plugin-grid a:nth-child(5)  { animation-delay: 140ms; }
    #plugin-grid a:nth-child(6)  { animation-delay: 175ms; }
    #plugin-grid a:nth-child(7)  { animation-delay: 210ms; }
    #plugin-grid a:nth-child(8)  { animation-delay: 245ms; }
    #plugin-grid a:nth-child(9)  { animation-delay: 280ms; }
    #plugin-grid a:nth-child(10) { animation-delay: 315ms; }
    #plugin-grid a:nth-child(11) { animation-delay: 350ms; }
    #plugin-grid a:nth-child(12) { animation-delay: 385ms; }

    #plugin-grid.htmx-swapping { opacity: 0; transition: opacity 0.1s ease; }
    #plugin-grid.htmx-settling  { opacity: 0; }
    #plugin-grid                { transition: opacity 0.15s ease; }
  </style>
</head>
<body>
  <nav class="rc-nav px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="/" class="rc-nav-logo">Claude Marketplace</a>
      <div class="flex gap-6">
        <a href="/" class="rc-nav-link">Browse</a>
        <a href="/sources" class="rc-nav-link">Sources</a>
      </div>
    </div>
  </nav>
  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
